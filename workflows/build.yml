name: Build Pro Binary

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core + pro + dev)
        run: |
          pip install -e ".[pro,dev,aider]"
      - name: Run tests
        run: pytest tests/ -v

  build:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          pip install -e ".[pro,aider]"
          pip install nuitka pyarmor

      - name: Obfuscate Pro modules
        run: python build/obfuscate.py

      - name: Build with Nuitka
        run: python build/build.py --onefile

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctf-${{ matrix.os }}
          path: dist/ctf-*
